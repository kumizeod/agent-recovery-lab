<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">黑暗女巫</title>
  <desc id="desc">月光下，一位披着深紫色斗篷的女巫捧着发光魔法球。</desc>
  <defs>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312051"/>
      <stop offset="0.55" stop-color="#171126"/>
      <stop offset="1" stop-color="#080711"/>
    </linearGradient>
    <linearGradient id="hat" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#503378"/>
      <stop offset="0.5" stop-color="#21142f"/>
      <stop offset="1" stop-color="#0b0912"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5dcf5"/>
      <stop offset="0.5" stop-color="#9b88b9"/>
      <stop offset="1" stop-color="#4a3b64"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#f5ecff"/>
      <stop offset="0.22" stop-color="#d9b6ff"/>
      <stop offset="0.58" stop-color="#9563e8"/>
      <stop offset="1" stop-color="#4b237c"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#b388ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

